<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C4CA2">
<meta name="robots" content="noindex, nofollow">
<title>راكان · تتبع طلبيتك</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<style>
@font-face { font-family: Tajawal; src: url(fonts/Tajawal-Regular.ttf); font-weight: 400; }
@font-face { font-family: Tajawal; src: url(fonts/Tajawal-Bold.ttf); font-weight: 700; }
@font-face { font-family: Tajawal; src: url(fonts/Tajawal-ExtraBold.ttf); font-weight: 800; }
:root { --blue: #0C4CA2; --deep: #08386F; --orange: #F15C22; --ok: #157347; --ink: #1B2433; --muted: #5B6678; --line: #DCE3EE; --card: #fff; --tint: #F2F6FC; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: Tajawal, "Segoe UI", Tahoma, sans-serif; color: var(--ink); background: #E9EEF5; }
#map { position: fixed; inset: 0; }
.top { position: fixed; top: calc(10px + env(safe-area-inset-top)); inset-inline: 12px; z-index: 500; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.top img { height: 38px; background: #fff; border-radius: 12px; padding: 4px 8px; box-shadow: 0 2px 10px rgba(0,0,0,.15); pointer-events: auto; }
.live { background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; box-shadow: 0 2px 10px rgba(0,0,0,.15); display: flex; gap: 6px; align-items: center; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px #D7F0E1; }
.live.off i { background: #999; box-shadow: none; }
.panel { position: fixed; bottom: 0; inset-inline: 0; z-index: 600; background: var(--card); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(8,20,40,.18);
  padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.st { font-size: 21px; font-weight: 800; margin: 0; color: var(--deep); }
.eta { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 2px; }
.eta b { font-size: 34px; font-weight: 800; color: var(--blue); line-height: 1.1; }
.eta span { color: var(--muted); font-size: 15px; font-weight: 700; }
.sub { color: var(--muted); font-size: 14.5px; margin: 2px 0 0; }
.steps { display: flex; gap: 6px; margin: 16px 0 14px; }
.steps div { flex: 1; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.steps div::before { content: ""; display: block; height: 5px; border-radius: 3px; background: var(--line); margin-bottom: 6px; }
.steps div.on { color: var(--blue); }
.steps div.on::before { background: var(--blue); }
.steps div.ok { color: var(--ok); }
.steps div.ok::before { background: var(--ok); }
.drv { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--tint); border-radius: 14px; }
.drv .av { width: 44px; height: 44px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; flex-shrink: 0; }
.drv b { display: block; font-size: 16px; }
.drv small { color: var(--muted); font-size: 13px; }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin-top: 12px; }
.msg { padding: 30px 20px; text-align: center; }
.msg b { display: block; font-size: 19px; margin-bottom: 6px; }
.done { color: var(--ok); }
.rk-truck { background: none; border: 0; }
.rk-tc { position: absolute; left: 13px; top: 13px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.rk-hd { position: absolute; inset: 0; transition: transform .6s; }
.rk-pulse { position: absolute; inset: -9px; border-radius: 50%; border: 3px solid; opacity: 0; animation: rkp 2s infinite; }
@keyframes rkp { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(1.4); opacity: 0; } }
.rk-tl { display: none; }
.rk-stop { background: none; border: 0; }
.leaflet-control-attribution { font-size: 10px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><img src="logo.png" alt="راكان"><span class="live" id="live"><i></i><span>مباشر</span></span></div>
<div class="panel" id="panel"><div class="grab"></div><div class="msg">جارٍ تحميل حالة طلبيتك…</div></div>
<script src="config.js"></script>
<script src="leaflet.js"></script>
<script src="map.js"></script>
<script src="track.js"></script>
</body>
</html>
